<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Instagram Audience Scraper: architecture v2</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#510C3C"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C01624"/>
    </marker>
    <style>
      .h { font-size: 15px; font-weight: 700; fill: #1A1A1A; }
      .hw { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .t { font-size: 12.5px; fill: #444; }
      .tb { font-size: 12.5px; font-weight: 600; fill: #510C3C; }
      .s { font-size: 11.5px; fill: #666; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 12px; fill: #510C3C; }
      .box { fill: #FFFFFF; stroke: #D8CCC4; stroke-width: 1.2; }
      .chip { fill: #FCF7F3; stroke: #D8CCC4; stroke-width: 1; }
      .mini { fill: #F6EDF1; stroke: #E2CFD8; stroke-width: 1; }
      .line { stroke: #510C3C; stroke-width: 1.6; fill: none; }
      .line-red { stroke: #C01624; stroke-width: 1.6; fill: none; }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1200" height="1500" fill="#FCF7F3"/>

  <!-- Title -->
  <text x="40" y="42" font-size="26" font-weight="800" fill="#510C3C">Instagram Audience Scraper <tspan fill="#C01624">· Architecture v2</tspan></text>
  <text x="40" y="66" class="t">Shared MongoDB queue · always-on workers on N cloud servers · 50–200 accounts, each with its own proxy · read-only</text>
  <text x="40" y="86" class="s">Capacity: ~1,750 requests per influencer (full audience) · 100 influencers/day ≈ 175k requests/day ≈ 190–200 accounts at 1,000 requests/day</text>

  <!-- A. Inputs and control -->
  <rect x="40" y="104" width="340" height="92" rx="10" class="box"/>
  <rect x="40" y="104" width="6" height="92" rx="3" fill="#C01624"/>
  <text x="60" y="130" class="h">Influencer list</text>
  <text x="60" y="152" class="t">2,500–3,000 profiles</text>
  <text x="60" y="174" class="code">scraper enqueue list.csv · POST /jobs</text>

  <rect x="430" y="104" width="340" height="92" rx="10" class="box"/>
  <rect x="430" y="104" width="6" height="92" rx="3" fill="#C01624"/>
  <text x="450" y="130" class="h">Control (CLI)</text>
  <text x="450" y="152" class="code">login · enqueue · worker · run · status</text>
  <text x="450" y="174" class="t">queue, budgets, freezes, server locks</text>

  <rect x="820" y="104" width="340" height="92" rx="10" class="box"/>
  <rect x="820" y="104" width="6" height="92" rx="3" fill="#C01624"/>
  <text x="840" y="130" class="h">REST API · Swagger /docs</text>
  <text x="840" y="152" class="code">/influencers /analytics /overlap</text>
  <text x="840" y="174" class="code">/jobs /queue /accounts /status /events</text>

  <path d="M210,196 L210,238" class="line" marker-end="url(#arrow)"/>
  <text x="218" y="222" class="s">add jobs</text>
  <path d="M600,196 L600,238" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M990,196 L990,238" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="998" y="222" class="s">read data · add jobs</text>

  <!-- B. MongoDB -->
  <rect x="40" y="240" width="1120" height="190" rx="12" fill="#FFFFFF" stroke="#510C3C" stroke-width="2"/>
  <path d="M40,252 a12,12 0 0 1 12,-12 h1096 a12,12 0 0 1 12,12 v22 h-1120 z" fill="#510C3C"/>
  <text x="60" y="263" class="hw">MongoDB Atlas · one source of truth for the queue and all data</text>

  <g>
    <rect x="56" y="290" width="172" height="124" rx="8" class="chip"/>
    <text x="68" y="312" class="code" font-weight="700">checkpoints</text>
    <text x="68" y="334" class="tb">Influencer job queue</text>
    <text x="68" y="354" class="s">status · lease_until</text>
    <text x="68" y="372" class="s">stages done (resume)</text>
    <text x="68" y="390" class="s">retry ≤ 3 attempts</text>

    <rect x="240" y="290" width="172" height="124" rx="8" class="chip"/>
    <text x="252" y="312" class="code" font-weight="700">audience</text>
    <text x="252" y="334" class="tb">Engager queue + profiles</text>
    <text x="252" y="354" class="s">wanted · enriched · lease</text>
    <text x="252" y="372" class="s">one doc per user id</text>
    <text x="252" y="390" class="s">engaged_with [influencers]</text>

    <rect x="424" y="290" width="172" height="124" rx="8" class="chip"/>
    <text x="436" y="312" class="code" font-weight="700">account_state</text>
    <text x="436" y="334" class="tb">Per-account control</text>
    <text x="436" y="354" class="s">server lock (heartbeat)</text>
    <text x="436" y="372" class="s">requests today · budget</text>
    <text x="436" y="390" class="s">freeze · needs_login</text>

    <rect x="608" y="290" width="172" height="124" rx="8" class="chip"/>
    <text x="620" y="312" class="code" font-weight="700">influencers</text>
    <text x="620" y="334" class="tb">Influencer profiles</text>
    <text x="620" y="354" class="s">followers, category, bio</text>
    <text x="620" y="372" class="s">post_ids</text>
    <text x="620" y="390" class="s">audience_ids</text>

    <rect x="792" y="290" width="172" height="124" rx="8" class="chip"/>
    <text x="804" y="312" class="code" font-weight="700">posts</text>
    <text x="804" y="334" class="tb">Influencer posts</text>
    <text x="804" y="354" class="s">25 per influencer</text>
    <text x="804" y="372" class="s">likes, comments, views</text>
    <text x="804" y="390" class="s">liker_ids · comments</text>

    <rect x="976" y="290" width="172" height="124" rx="8" class="chip"/>
    <text x="988" y="312" class="code" font-weight="700">events</text>
    <text x="988" y="334" class="tb">Instagram error log</text>
    <text x="988" y="354" class="s">per account + proxy</text>
    <text x="988" y="372" class="s">exception · HTTP status</text>
    <text x="988" y="390" class="s">no cookies / passwords</text>
  </g>

  <!-- MongoDB <-> servers -->
  <path d="M350,432 L350,488" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M800,432 L800,488" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M1050,432 L1050,488" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="362" y="456" class="s">claim jobs atomically (leased) · write results · renew account locks</text>
  <text x="362" y="472" class="s">a crashed server's leases expire → other servers pick the jobs up</text>

  <!-- C. Servers -->
  <rect x="40" y="490" width="620" height="400" rx="12" class="box"/>
  <path d="M40,502 a12,12 0 0 1 12,-12 h596 a12,12 0 0 1 12,12 v22 h-620 z" fill="#510C3C"/>
  <text x="60" y="513" class="hw">Cloud server 1 · <tspan font-family="Consolas, 'Courier New', monospace" font-size="13">scraper worker</tspan> (WORKER_ID=server-1)</text>

  <text x="60" y="552" class="tb">Engagement accounts · 1 thread each</text>
  <rect x="60" y="562" width="280" height="150" rx="8" class="chip"/>
  <text x="74" y="582" class="code" font-weight="700">eng_account_1</text>
  <rect x="72" y="592" width="256" height="34" rx="6" class="mini"/>
  <text x="82" y="608" class="tb" font-size="12">Session Manager</text>
  <text x="82" y="621" class="s" font-size="10.5">saved session · same device every run</text>
  <rect x="72" y="632" width="256" height="34" rx="6" class="mini"/>
  <text x="82" y="648" class="tb" font-size="12">Rate Limit / Challenge Handler</text>
  <text x="82" y="661" class="s" font-size="10.5">delays · backoff · freeze · daily budget</text>
  <rect x="72" y="672" width="256" height="34" rx="6" class="mini"/>
  <text x="82" y="688" class="tb" font-size="12">Proxy · stable egress</text>
  <text x="82" y="701" class="s" font-size="10.5">one fixed IP per account, never rotated</text>
  <text x="60" y="732" class="s">× k engagement accounts (≈ 1 per 10 audience)</text>

  <text x="360" y="552" class="tb">Audience accounts · 1 thread each</text>
  <rect x="360" y="562" width="280" height="150" rx="8" class="chip"/>
  <text x="374" y="582" class="code" font-weight="700">aud_account_1</text>
  <rect x="372" y="592" width="256" height="34" rx="6" class="mini"/>
  <text x="382" y="608" class="tb" font-size="12">Session Manager</text>
  <text x="382" y="621" class="s" font-size="10.5">saved session · same device every run</text>
  <rect x="372" y="632" width="256" height="34" rx="6" class="mini"/>
  <text x="382" y="648" class="tb" font-size="12">Rate Limit / Challenge Handler</text>
  <text x="382" y="661" class="s" font-size="10.5">delays · backoff · freeze · daily budget</text>
  <rect x="372" y="672" width="256" height="34" rx="6" class="mini"/>
  <text x="382" y="688" class="tb" font-size="12">Proxy · stable egress</text>
  <text x="382" y="701" class="s" font-size="10.5">one fixed IP per account, never rotated</text>
  <text x="360" y="732" class="s">× m audience accounts</text>

  <rect x="60" y="748" width="580" height="126" rx="8" fill="#FCF7F3" stroke="#C01624" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="74" y="770" class="tb">Every account loops:</text>
  <text x="74" y="792" class="t">1. Frozen? sleep until the freeze ends. Budget used? sleep until tomorrow.</text>
  <text x="74" y="812" class="t">2. Claim an influencer job (engagement) or an engager job (audience).</text>
  <text x="74" y="832" class="t">3. Nothing to do? wait WORKER_POLL_SECONDS and check again.</text>
  <text x="74" y="856" class="s">Session lost → account flagged needs_login, its job released, other accounts keep going.</text>

  <rect x="690" y="490" width="220" height="400" rx="12" class="box"/>
  <path d="M690,502 a12,12 0 0 1 12,-12 h196 a12,12 0 0 1 12,12 v22 h-220 z" fill="#510C3C"/>
  <text x="706" y="513" class="hw">Cloud server 2</text>
  <text x="706" y="556" class="t">Same worker code</text>
  <text x="706" y="578" class="t">Own .env: its accounts,</text>
  <text x="706" y="596" class="t">proxies, WORKER_ID</text>
  <text x="706" y="626" class="s">e.g. 50–70 accounts</text>
  <g fill="#F6EDF1" stroke="#E2CFD8">
    <rect x="706" y="644" width="40" height="26" rx="4"/><rect x="752" y="644" width="40" height="26" rx="4"/><rect x="798" y="644" width="40" height="26" rx="4"/><rect x="844" y="644" width="40" height="26" rx="4"/>
    <rect x="706" y="676" width="40" height="26" rx="4"/><rect x="752" y="676" width="40" height="26" rx="4"/><rect x="798" y="676" width="40" height="26" rx="4"/><rect x="844" y="676" width="40" height="26" rx="4"/>
    <rect x="706" y="708" width="40" height="26" rx="4"/><rect x="752" y="708" width="40" height="26" rx="4"/><rect x="798" y="708" width="40" height="26" rx="4"/><rect x="844" y="708" width="40" height="26" rx="4"/>
  </g>
  <text x="706" y="760" class="s">1 account = 1 thread</text>
  <text x="706" y="778" class="s">= 1 proxy</text>
  <text x="706" y="808" class="s">An account is locked to one</text>
  <text x="706" y="826" class="s">server: a second server</text>
  <text x="706" y="844" class="s">refuses to run it.</text>

  <rect x="940" y="490" width="220" height="400" rx="12" class="box"/>
  <path d="M940,502 a12,12 0 0 1 12,-12 h196 a12,12 0 0 1 12,12 v22 h-220 z" fill="#510C3C"/>
  <text x="956" y="513" class="hw">Cloud server N</text>
  <text x="956" y="556" class="t">Add servers to scale</text>
  <text x="956" y="578" class="t">No code change: point</text>
  <text x="956" y="596" class="t">at the same MongoDB</text>
  <text x="956" y="626" class="s">3–4 servers × 2 vCPU / 4 GB</text>
  <g fill="#F6EDF1" stroke="#E2CFD8">
    <rect x="956" y="644" width="40" height="26" rx="4"/><rect x="1002" y="644" width="40" height="26" rx="4"/><rect x="1048" y="644" width="40" height="26" rx="4"/><rect x="1094" y="644" width="40" height="26" rx="4"/>
    <rect x="956" y="676" width="40" height="26" rx="4"/><rect x="1002" y="676" width="40" height="26" rx="4"/><rect x="1048" y="676" width="40" height="26" rx="4"/><rect x="1094" y="676" width="40" height="26" rx="4"/>
    <rect x="956" y="708" width="40" height="26" rx="4"/><rect x="1002" y="708" width="40" height="26" rx="4"/><rect x="1048" y="708" width="40" height="26" rx="4"/><rect x="1094" y="708" width="40" height="26" rx="4"/>
  </g>
  <text x="956" y="760" class="s">Restarts resume from</text>
  <text x="956" y="778" class="s">checkpoints</text>
  <text x="956" y="808" class="s">Planned: systemd service</text>
  <text x="956" y="826" class="s">+ deploy guide (step 4)</text>

  <!-- D. Instagram -->
  <path d="M200,890 L200,958" class="line-red" marker-end="url(#arrow-red)"/>
  <path d="M500,890 L500,958" class="line-red" marker-end="url(#arrow-red)"/>
  <path d="M800,890 L800,958" class="line-red" marker-end="url(#arrow-red)"/>
  <path d="M1050,890 L1050,958" class="line-red" marker-end="url(#arrow-red)"/>
  <text x="210" y="930" class="s">one request at a time per account, via its own proxy</text>
  <rect x="40" y="960" width="1120" height="60" rx="10" fill="#FFFFFF" stroke="#C01624" stroke-width="1.6"/>
  <text x="60" y="987" class="h">Instagram private API <tspan class="t" font-weight="400">(instagrapi)</tspan></text>
  <text x="60" y="1008" class="s">Read-only: nothing likes, follows, comments, posts or sends DMs. Blocks are handled per type: 429 → backoff, please-wait → cooldown, challenge / action block → freeze.</text>

  <!-- E. What each job does -->
  <text x="40" y="1062" font-size="18" font-weight="800" fill="#510C3C">What each job does</text>

  <rect x="40" y="1074" width="1120" height="170" rx="12" class="box"/>
  <text x="56" y="1100" class="tb">Influencer job · engagement account</text>
  <g>
    <rect x="56" y="1114" width="150" height="62" rx="8" class="chip"/>
    <text x="68" y="1140" class="h" font-size="13.5">Claim influencer</text>
    <text x="68" y="1160" class="s">lease 20 min</text>
    <rect x="226" y="1114" width="160" height="62" rx="8" class="chip"/>
    <text x="238" y="1140" class="h" font-size="13.5">Influencer profile</text>
    <text x="238" y="1160" class="s">1 request</text>
    <rect x="406" y="1114" width="160" height="62" rx="8" class="chip"/>
    <text x="418" y="1140" class="h" font-size="13.5">Recent posts</text>
    <text x="418" y="1160" class="s">25 posts · 1 request</text>
    <rect x="586" y="1114" width="170" height="62" rx="8" class="chip"/>
    <text x="598" y="1140" class="h" font-size="13.5">Likers + commenters</text>
    <text x="598" y="1160" class="s">50 + 50 per post</text>
    <rect x="776" y="1114" width="180" height="62" rx="8" class="chip"/>
    <text x="788" y="1140" class="h" font-size="13.5">Unique profile dedup</text>
    <text x="788" y="1160" class="s">atomic insert per user id</text>
    <rect x="976" y="1114" width="170" height="62" rx="8" class="chip" stroke="#C01624"/>
    <text x="988" y="1140" class="h" font-size="13.5">Queue engagers</text>
    <text x="988" y="1160" class="s">wanted = true</text>
    <path d="M206,1145 L224,1145" class="line" marker-end="url(#arrow)"/>
    <path d="M386,1145 L404,1145" class="line" marker-end="url(#arrow)"/>
    <path d="M566,1145 L584,1145" class="line" marker-end="url(#arrow)"/>
    <path d="M756,1145 L774,1145" class="line" marker-end="url(#arrow)"/>
    <path d="M956,1145 L974,1145" class="line" marker-end="url(#arrow)"/>
  </g>
  <text x="56" y="1202" class="t">Retry &amp; Checkpoint: progress saved after every stage and every post; the heartbeat renews the lease.</text>
  <text x="56" y="1222" class="t">Failed → back in the queue (max 3 attempts). Crash → lease expires → another server resumes from the checkpoint.</text>

  <path d="M1061,1176 C1061,1250 1061,1250 1061,1268" class="line-red dash" marker-end="url(#arrow-red)"/>
  <text x="1070" y="1258" class="s" fill="#C01624">feeds</text>

  <rect x="40" y="1270" width="1120" height="124" rx="12" class="box"/>
  <text x="56" y="1296" class="tb">Engager job · audience account</text>
  <g>
    <rect x="56" y="1310" width="170" height="62" rx="8" class="chip"/>
    <text x="68" y="1336" class="h" font-size="13.5">Claim engager</text>
    <text x="68" y="1356" class="s">lease 30 min</text>
    <rect x="246" y="1310" width="190" height="62" rx="8" class="chip"/>
    <text x="258" y="1336" class="h" font-size="13.5">Public profile data</text>
    <text x="258" y="1356" class="s">1 request</text>
    <rect x="456" y="1310" width="210" height="62" rx="8" class="chip"/>
    <text x="468" y="1336" class="h" font-size="13.5">Recent profile posts</text>
    <text x="468" y="1356" class="s">up to 5 · public accounts only</text>
    <rect x="686" y="1310" width="170" height="62" rx="8" class="chip"/>
    <text x="698" y="1336" class="h" font-size="13.5">Mark enriched</text>
    <text x="698" y="1356" class="s">lease released</text>
    <path d="M226,1341 L244,1341" class="line" marker-end="url(#arrow)"/>
    <path d="M436,1341 L454,1341" class="line" marker-end="url(#arrow)"/>
    <path d="M666,1341 L684,1341" class="line" marker-end="url(#arrow)"/>
  </g>
  <text x="878" y="1332" class="s">Errors retried up to 3 times.</text>
  <text x="878" y="1350" class="s">Private or deleted accounts:</text>
  <text x="878" y="1368" class="s">profile counts only, no posts.</text>

  <!-- F. Output -->
  <rect x="40" y="1408" width="1120" height="76" rx="12" fill="#510C3C"/>
  <text x="60" y="1434" class="hw">Audience analytics → REST API</text>
  <text x="60" y="1455" font-size="12.5" fill="#FFFFFF" opacity="0.9">Engagement rate · private / business / verified % · follower-size buckets · categories · cities · active in 30 days · suspicious % · repeat engagers · overlap between influencers</text>
  <text x="60" y="1474" font-size="11.5" fill="#FFFFFF" opacity="0.7">Planned next: pacing across active hours + warm-up for new accounts · analytics saved per influencer · monitoring + deploy guide</text>
</svg>
